[project]
name = "divine-aperture-api"
version = "0.1.0"
description = "FastAPI backend for Divine Aperture Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "email-validator>=2.2,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "supabase>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
